name: IPTV Health Check

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run health check
        run: python scripts/health_check.py
        env:
          OUTPUT_DIR: output

      - name: Set summary vars
        id: summary
        run: |
          WORKING=$(python3 -c "import json; print(json.load(open('output/summary.json'))['working'])")
          TOTAL=$(python3 -c "import json; print(json.load(open('output/summary.json'))['total_tested'])")
          RATE=$(python3 -c "import json; print(json.load(open('output/summary.json'))['success_rate'])")
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "working=$WORKING" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "rate=$RATE" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "🇮🇳 IPTV India v${{ github.run_number }} — ${{ steps.summary.outputs.working }}/${{ steps.summary.outputs.total }} (${{ steps.summary.outputs.rate }})"
          body: |
            ## IPTV India Channel List

            - **Tested:** ${{ steps.summary.outputs.total }} channels
            - **Working:** ${{ steps.summary.outputs.working }} (${{ steps.summary.outputs.rate }})
            - **Generated:** ${{ steps.summary.outputs.date }}

            ### 📁 Files
            - `india.m3u` — VLC-ready playlist
            - `channels_working.json` — working channels with metadata
            - `channels.json` — all tested channels

            ### 🚀 Usage
            ```bash
            # In VLC
            https://github.com/${{ github.repository }}/releases/latest/download/india.m3u
            ```
          files: |
            output/india.m3u
            output/channels_working.json
            output/channels.json
            output/summary.json
          make_latest: true
